# Site settings
title: Hande Sodacı # site title
description: >- # site description
  Portfolio of Hande Sodacı, PhD — human-robot interaction and psycholinguistics
  researcher moving into UX research, HCI, and data science. Case studies,
  projects, and writing from a dissertation on how people adapt communication
  to AI partners.
lang: en-US # default lang
timezone: Europe/Istanbul # set your timezone
image: assets/img/ogp.png # This image used for Open Graph more info https://ogp.me/
mode: dark # default theme "dark" | "light"

# Profile settings
author:
  name: Hande Sodacı # author name
  bio: >- # tell to the world
    PhD in Psychology (Koç University, 2026). Researching human-robot
    interaction and psycholinguistics — now building UX research and data
    science projects.
  username: hsodaci # general username
  github: hsodaci # github username
  linkedin: hsodaci # linkedin username (linkedin.com/in/USERNAME)
  orcid: 0000-0003-1995-6005 # ORCID id
  email: sodaci92@gmail.com # email adress
  avatar: /assets/img/avatar.jpg # change with your own avatar

# URL settings
url: "https://hsodaci.github.io" #
baseurl:
permalink: /:title/
google_analytics: # leave it blank if not wish
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Homepage limit posts
number_of_posts: 5

# Build settings
# theme: klise
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec

# Plugins (kept to GitHub Pages' supported plugin list, see
# https://pages.github.com/versions/)
plugins:
  - jekyll-feed
  - jekyll-sitemap
